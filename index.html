<!DOCTYPE html>
<html><head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Test</title>
<script src="https://sdk.minepi.com/pi-sdk.js"></script>
</head><body style="text-align:center;padding-top:100px">
<h1>Hendchi Test</h1>
<button onclick="test()" style="padding:20px;font-size:20px;background:#7B2CBF;color:#fff;border:none;border-radius:10px">LOGIN WITH PI</button>
<script>
Pi.init({ version: "2.0", sandbox: true });
async function test(){
  try{
    const auth = await Pi.authenticate(['username']);
    alert("IT WORKS! Welcome " + auth.user.username);
  }catch(e){alert("Error: "+e.message)}
}
</script></body></html>
