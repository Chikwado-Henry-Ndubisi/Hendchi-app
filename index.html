<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HENDCHI - Earn Pi</title>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial; background: #FFFFFF; margin: 0; padding: 24px; text-align: center; }
    .logo { color: #6A0DAD; font-size: 22px; font-weight: 700; text-align: left; margin-bottom: 30px; }
    h1 { font-size: 28px; color: #111; margin: 15px 0; font-weight: 700; line-height: 1.3; }
    p { color: #555; font-size: 15px; line-height: 1.6; margin-bottom: 30px; padding: 0 10px; }
    .dots { margin: 25px 0; }
    .dots span { display: inline-block; width: 10px; height: 10px; background: #E0E0E0; border-radius: 50%; margin: 0 5px; }
    .dots .active { background: #6A0DAD; }
    
    /* BIG BUTTONS LIKE HAWKIT */
    .btn { 
      background: #6A0DAD; 
      color: white; 
      border: none; 
      padding: 18px; 
      border-radius: 14px; 
      font-size: 17px; 
      width: 100%; 
      max-width: 400px;
      margin: 12px 0; 
      font-weight: 700; 
      box-shadow: 0 4px 10px rgba(106,13,173,0.2);
    }
    .btn:active { background: #5B0C9A; transform: scale(0.98); }
    .btn-outline { background: white; color: #6A0DAD; border: 2px solid #6A0DAD; box-shadow: none; }
    .btn-outline:active { background: #F5EBFF; }
  </style>
</head>
<body>
  <div class="logo">💜 hendchi.pi</div>

  <h1>Get Paid in Pi for<br>Posting Adverts Daily</h1>
  <p>Earn daily Pi by posting adverts and performing simple social tasks for top businesses and brands on your social media account.</p>

  <div class="dots">
    <span class="active"></span><span></span><span></span><span></span>
  </div>

  <button class="btn" onclick="loginWithPi()">LOGIN WITH PI</button>
  <button class="btn btn-outline" onclick="alert('Create Account - Coming Soon')">CREATE FREE ACCOUNT</button>

  <p id="user" style="margin-top:25px; font-weight:700; color:#6A0DAD; font-size:16px;"></p>

<!-- Pi SDK -->
<script src="https://sdk.minepi.com/pi-sdk.js"></script>
<script>
  Pi.init({ version: "2.0", sandbox: true });

  async function loginWithPi() {
    try {
      const scopes = ['username', 'payments'];
      const auth = await Pi.authenticate(scopes, onIncompletePaymentFound);
      document.getElementById("user").innerText = "Welcome @" + auth.user.username;
      alert("Login Successful!");
    } catch (err) {
      alert("Login Failed");
    }
  }
  
  function onIncompletePaymentFound(payment) {
    console.log("Incomplete payment:", payment);
  }
</script>
</body>
  </html>
