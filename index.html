<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hendchi</title>
<script src="https://sdk.minepi.com/pi-sdk.js"></script>
<style>
* {margin:0; padding:0; box-sizing:border-box; font-family: Arial, sans-serif;}
body {background:#fff;}
.page {display:none; width:100%; min-height:100vh;}
.active {display:block;}
.top {padding:20px; display:flex; justify-content:space-between; align-items:center;}
.logo {display:flex; align-items:center; gap:8px; color:#6b21a8; font-size:22px; font-weight:900;}
.logo-icon {width:28px; height:28px; background:#ff3b30; border-radius:8px 0 8px 0;}
.content {padding:60px 30px 20px; text-align:center;}
.content h2 {font-size:28px; color:#000; line-height:1.3; margin-bottom:14px; font-weight:900;}
.content p {font-size:15px; color:#666; line-height:1.6; padding:0 10px;}
.dots {display:flex; justify-content:center; gap:8px; margin:30px 0 50px;}
.dot {width:8px; height:8px; background:#d0d0d0; border-radius:50%;}
.dot.active {width:24px; background:#6b21a8; border-radius:12px;}
.bottom {padding:0 30px 40px;}
.btn1 {width:100%; padding:16px; background:#6b21a8; color:#fff; border:none; border-radius:12px; font-size:16px; font-weight:900; margin-bottom:12px; text-transform:uppercase;}
.btn2 {width:100%; padding:16px; background:#fff; color:#6b21a8; border:2px solid #6b21a8; border-radius:12px; font-size:16px; font-weight:900; text-transform:uppercase;}
#home {background:#f5f5f5; padding:20px;}
#home h1 {font-size:24px;}
.card {background:linear-gradient(135deg,#6b21a8,#9333ea); color:#fff; padding:25px; border-radius:20px; text-align:center; margin-top:20px;}
.card h2 {font-size:16px; font-weight:400;}
.card h3 {font-size:40px; margin-top:8px;}
</style>
</head>
<body>

<div id="onboard" class="page active">
  <div class="top">
    <div class="logo"><div class="logo-icon"></div>hendchi</div>
    <div style="font-size:24px;">☰</div>
  </div>
  <div class="content">
    <h2 id="title">Sell Faster on<br>Hendchi Marketplace</h2>
    <p id="text">Take advantage of our huge web traffic and sell your products faster</p>
    <div class="dots"><span class="dot"></span><span class="dot"></span><span class="dot"></span><span class="dot active"></span></div>
  </div>
  <div class="bottom">
    <button class="btn1" onclick="piLogin()">CREATE FREE ACCOUNT</button>
    <button class="btn2" onclick="piLogin()">LOGIN TO YOUR ACCOUNT</button>
  </div>
</div>

<div id="home" class="page">
  <h1>Welcome <span id="user">Pioneer</span> 👋</h1>
  <div class="card"><h2>Your Pi Balance</h2><h3>0.000 π</h3></div>
</div>

<script>
window.addEventListener('load', function() {
  window.Pi.init({ version: "2.0", sandbox: true });
});
let n=3, timer;
const data=[
 {t:"Get Paid for<br>Posting Adverts Daily<br>on Your Social Media",p:"Earn daily Pi by posting adverts and performing simple social tasks"},
 {t:"Get People to Post<br>Your Adverts on<br>their Social Media",p:"Get people with atleast 1,000 followers to post your adverts"},
 {t:"Boost Your Social<br>Media Engagement<br>and Portfolio",p:"Get real people to grow your social media portfolio"},
 {t:"Sell Faster on<br>Hendchi Marketplace",p:"Take advantage of our huge web traffic and sell your products faster"}
];
function show(id){document.querySelectorAll('.page').forEach(x=>x.classList.remove('active'));document.getElementById(id).classList.add('active')}
function slide(){n=(n+1)%4;document.getElementById('title').innerHTML=data[n].t;document.getElementById('text').innerText=data[n].p;document.querySelectorAll('.dot').forEach((d,i)=>d.className='dot'+(i==n?' active':''))}
timer=setInterval(slide,3000);
function piLogin(){clearInterval(timer);window.Pi.authenticate(['username', 'payments'], function(payment) {}, function(error) {alert("Login cancelled");timer=setInterval(slide,3000)}).then(function(auth) {document.getElementById('user').innerText = auth.user.username;show('home')});}
</script>
</body>
</html>
