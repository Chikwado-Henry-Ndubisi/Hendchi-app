<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Earn - Hendchi</title>
<style>
body{margin:0;font-family:Arial;background:#f1f1f1;padding-bottom:110px}
.header{background:#6B21A8;color:#fff;padding:25px;font-size:32px;font-weight:900;text-align:center}
.balance-bar{background:#fff;padding:20px;text-align:center;font-size:24px;border-bottom:3px solid #ddd}
.task{background:#fff;margin:20px;border-radius:18px;padding:25px}
.task-title{font-size:28px;font-weight:900;margin-bottom:10px}
.task-desc{font-size:22px;color:#666;margin-bottom:15px}
.task-reward{font-size:30px;color:#16a34a;font-weight:900}
.btn{background:#6B21A8;color:#fff;border:none;padding:22px;width:100%;font-size:24px;font-weight:900;border-radius:15px;margin-top:15px}
.bottom-nav{position:fixed;bottom:0;left:0;right:0;background:#fff;display:flex;justify-content:space-around;padding:15px 0;border-top:3px solid #ddd}
.nav-item{font-size:20px;color:#666;text-align:center}
.nav-item.active{color:#6B21A8;font-weight:900}
</style>
<script>
function completeTask(reward) {
  alert('Task Submitted! π' + reward + ' will be added to your balance in 5 minutes');
}
</script>
</head>
<body>

<div class="header">Earn Tasks</div>
<div class="balance-bar">Your Balance: <b>π47.55</b></div>

<div class="task">
  <div class="task-title">Follow @BrandOnInstagram</div>
  <div class="task-desc">Follow the brand and screenshot your profile</div>
  <div class="task-reward">+ π1.50</div>
  <button class="btn" onclick="completeTask(1.50)">Start Task</button>
</div>

<div class="task">
  <div class="task-title">Like 5 Posts on TikTok</div>
  <div class="task-desc">Like 5 posts from @HendchiBrand</div>
  <div class="task-reward">+ π2.00</div>
  <button class="btn" onclick="completeTask(2.00)">Start Task</button>
</div>

<div class="task">
  <div class="task-title">Share Post to WhatsApp Status</div>
  <div class="task-desc">Post our flyer and keep for 24hrs</div>
  <div class="task-reward">+ π3.00</div>
  <button class="btn" onclick="completeTask(3.00)">Start Task</button>
</div>

<div class="bottom-nav">
  <div class="nav-item" onclick="window.location.href='dashboard.html'">Home</div>
  <div class="nav-item active">Earn</div>
  <div class="nav-item" onclick="window.location.href='fund-wallet.html'">Fund</div>
  <div class="nav-item" onclick="window.location.href='withdraw.html'">Withdraw</div>
</div>

</body>
</html>
