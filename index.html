<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<link rel="stylesheet" href="style.css">
<title>Hendchi Login</title>
<script src="https://sdk.minepi.com/pi-sdk.js"></script>
</head>
<body>
  <div class="full-page">
    
    <div class="logo-area">
      <img src="logo.png" alt="Hendchi Logo">
    </div>
    
    <div class="text-area">
      <h1>Welcome to Hendchi</h1>
      <p>Sign in with your Pi Account to Start Earning</p>
    </div>
    
    <div class="button-area">
      <button class="btn" onclick="loginWithPi()">SIGN IN WITH PI</button>
      <p style="color: #aaa; font-size: 12px; text-align: center;">New user? Signing up is automatic</p>
    </div>
    
  </div>

<script>
Pi.init({ version: "2.0", sandbox: true });

function loginWithPi() {
  const scopes = ['username', 'payments'];
  
  Pi.authenticate(scopes, function(payment) {
    console.log('incomplete payment found', payment);
  })
  .then(function(auth) {
    alert("Welcome " + auth.user.username + "!");
    window.location.href = "home.html"; // go to homepage after login
  })
  .catch(function(error) {
    alert("Login failed: " + error);
  });
}
</script>

</body>
</html>
