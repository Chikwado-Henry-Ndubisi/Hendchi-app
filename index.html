<div class="slide">
  <h2 id="title">Trusted Pi Community</h2>
  <p id="text">Connect with real Pi pioneers to buy and sell</p>
</div>

<script>
const slides = [
  {
    title: "Trusted Pi Community",
    text: "Connect with real Pi pioneers to buy and sell"
  },
  {
    title: "Buy & Sell with Pi", 
    text: "List your products and get paid instantly in Pi"
  },
  {
    title: "Earn Pi by Posting Adverts",
    text: "Promote products and earn Pi directly to your wallet"
  },
  {
    title: "Fast & Secure",
    text: "All payments are secured by Pi Blockchain"
  }
];

let currentSlide = 0;
const titleEl = document.getElementById('title');
const textEl = document.getElementById('text');
const dots = document.querySelectorAll('.dot');

function showSlide(index) {
  titleEl.textContent = slides[index].title;
  textEl.textContent = slides[index].text;
  dots.forEach((dot, i) => dot.classList.toggle('active', i === index));
}

setInterval(() => {
  currentSlide = (currentSlide + 1) % slides.length;
  showSlide(currentSlide);
}, 3000); // changes every 3 seconds
   </script>
