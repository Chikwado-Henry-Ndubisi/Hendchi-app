<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Influencer Tasks - Hendchi</title>
<style>
body{margin:0;font-family:Arial;background:#f1f1f1;padding-bottom:110px}
.header{background:#6B21A8;color:#fff;padding:25px;font-size:32px;font-weight:900;text-align:center}
.box{background:#fff;padding:50px 25px;border-radius:20px;max-width:600px;margin:30px 20px;text-align:center}
.icon{font-size:80px;margin-bottom:20px}
h1{font-size:36px;font-weight:900;margin:20px 0}
p{font-size:24px;line-height:1.9;color:#444}
.fee-box{background:#FFF7ED;border:3px solid #FDBA74;padding:30px;border-radius:18px;margin:30px 0}
.fee-label{font-size:22px;color:#9A3412;font-weight:900}
.fee{font-size:60px;color:#EA580C;font-weight:900}
.note{font-size:20px;color:#666;margin:15px 0}
.btn{background:#6B21A8;color:#fff;border:none;padding:28px;width:100%;font-size:26px;font-weight:900;border-radius:18px;margin-top:20px}
.btn:disabled{background:#ccc}
</style>
</head>
<body>

<div class="header">⭐ Influencer Tasks</div>

<div class="box">
  <div class="icon">💰</div>
  <h1>Unlock Influencer Tasks</h1>
  <p>Access high-paying tasks, post adverts for brands, and earn more daily.</p>
  
  <div class="fee-box">
    <div class="fee-label">One-Time Activation Fee</div>
    <div class="fee">~π9.00</div>
    <div class="note">~ $0.90 USD worth of Pi</div>
  </div>
  
  <p class="note">Your current balance: <b>π47.55</b></p>
  <p class="note" style="color:#16a34a;font-weight:900">✓ This is a one-time payment. You won't pay again.</p>
  
  <button class="btn" onclick="alert('Fee deducted! Welcome to Influencer Tasks. Redirecting...')">Pay π9.00 & Activate</button>
  <button class="btn" style="background:#fff;color:#6B21A8;border:3px solid #6B21A8" onclick="window.location.href='fund-wallet.html'">Fund Wallet First</button>
</div>

</body>
</html>
