<!DOCTYPE html>
<html>
<head>
  <title>Hendchi App</title>
  <script src="https://sdk.minepi.com/pi-sdk.js"></script>
</head>
<body>
  <h1>Welcome to Hendchi</h1>
  <button id="login">Login with Pi</button>

  <script>
    Pi.init({ version: "2.0", sandbox: true });
    document.getElementById('login').onclick = function() {
      Pi.authenticate(['username', 'payments'], function(payment) {}, function(error) {}).then(function(auth) {
        alert("Logged in as: " + auth.user.username);
      });
    };
  </script>
</body>
</html>
