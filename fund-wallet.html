<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fund Wallet - Hendchi</title>
<style>
body{margin:0;font-family:Arial;background:#f1f1f1;padding:30px}
.header{color:#6B21A8;font-size:38px;font-weight:900;text-align:center;margin-bottom:30px}
.box{background:#fff;padding:40px 25px;border-radius:20px;max-width:600px;margin:0 auto}
.balance{font-size:24px;color:#666;text-align:center}
.amount{font-size:60px;color:#6B21A8;font-weight:900;text-align:center;margin:10px 0 30px 0}
input{width:100%;padding:25px;font-size:24px;border:3px solid #ddd;border-radius:15px;margin:15px 0;box-sizing:border-box}
.btn{background:#6B21A8;color:#fff;border:none;padding:28px;width:100%;font-size:26px;font-weight:900;border-radius:18px;margin-top:20px}
.note{font-size:20px;color:#444;line-height:1.8;margin-top:25px;text-align:center}
</style>
</head>
<body>

<div class="header">💰 Fund Wallet</div>

<div class="box">
  <div class="balance">Current Balance</div>
  <div class="amount">π47.55</div>
  
  <input type="number" placeholder="Enter Amount in Pi">
  <input type="text" placeholder="Pi Wallet Address / Transaction ID">
  
  <button class="btn" onclick="alert('Fund request submitted! We will credit you soon.')">Submit Fund Request</button>
  
  <div class="note">
    Send Pi to: <b>hendchi.pi.wallet</b><br>
    Minimum: π5.00<br>
    Funds are credited within 10 minutes
  </div>
</div>

</body>
</html>
