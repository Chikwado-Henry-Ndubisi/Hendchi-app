<!DOCTYPE html><html><head><meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0"><title>Withdraw - Hendchi</title><style>*{box-sizing:border-box}body{margin:0;font-family:Arial;background:#f1f1f1;padding-bottom:130px}.header{background:#6B21A8;color:#fff;padding:30px;font-size:38px;font-weight:900;text-align:center;position:sticky;top:0;z-index:10}.box{background:#fff;padding:35px 25px;border-radius:22px;margin:25px}.balance{font-size:60px;font-weight:900;color:#6B21A8;text-align:center;margin:15px 0}label{font-size:24px;font-weight:900;display:block;margin-top:25px}input{width:100%;padding:28px;font-size:26px;border:3px solid #ddd;border-radius:14px;margin-top:12px}.btn{background:#6B21A8;color:#fff;border:none;padding:28px;width:100%;font-size:28px;font-weight:900;border-radius:20px;margin-top:30px;cursor:pointer}.bottom-nav{position:fixed;bottom:0;left:0;right:0;background:#fff;display:flex;justify-content:space-around;padding:20px 0;border-top:4px solid #ddd;z-index:10}.nav-item{font-size:22px;color:#666;text-align:center;cursor:pointer;font-weight:900}.nav-item.active{color:#6B21A8}.nav-icon{font-size:38px;display:block}</style></head><body><div class="header">PLACE WITHDRAWALS</div><div class="box"><div class="balance"><span id="balance">0.00</span> Points</div><label>POINTS TO WITHDRAW</label><input type="number" id="pointsInput" placeholder="Enter Points"><div style="font-size:24px;text-align:center;margin-top:15px">You will get: <span id="piAmount">0.000</span> Pi</div><label>PI WALLET ADDRESS</label><input type="text" id="piWallet" placeholder="Enter your Pi Wallet Address"><button class="btn" onclick="requestWithdraw()">SUBMIT REQUEST</button></div><div class="bottom-nav"><div class="nav-item" onclick="window.location.href='index.html'"><span class="nav-icon">🏠</span>HOME</div><div class="nav-item" onclick="window.location.href='earn.html'"><span class="nav-icon">💰</span>EARN</div><div class="nav-item" onclick="window.location.href='advertise.html'"><span class="nav-icon">➕</span>ADVERTISE</div><div class="nav-item" onclick="window.location.href='marketplace.html'"><span class="nav-icon">🏪</span>MARKET</div><div class="nav-item active"><span class="nav-icon">☰</span>MORE</div></div><script>window.onload=function(){let p=parseFloat(localStorage.getItem('points'))||2450;document.getElementById('balance').innerText=p.toFixed(2);document.getElementById('pointsInput').oninput=function(){let p=parseFloat(this.value)||0;document.getElementById('piAmount').innerText=((p/100)*0.9).toFixed(3)}};function requestWithdraw(){let p=parseFloat(document.getElementById('pointsInput').value);let w=document.getElementById('piWallet').value;if(!p||p<100){alert('Minimum 100 Points = 0.9 Pi');return}let c=parseFloat(localStorage.getItem('points'))||2450;if(p>c){alert('Insufficient Points');return}if(w==''){alert('Enter Pi Wallet Address');return}localStorage.setItem('points',c-p);alert('Request Sent! '+p+' Points = '+((p/100)*0.9).toFixed(3)+' Pi');location.reload()}</script></body></html>
