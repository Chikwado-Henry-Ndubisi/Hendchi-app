<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Hendchi</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;background:#fff;color:#000;font-family:Arial,Helvetica,sans-serif}
.wrap{display:flex;flex-direction:column;height:100%;padding:15px 18px}
.top{text-align:center;padding:8px 0}
.top h2{font-size:40px;font-weight:900;color:#000;letter-spacing:-1px} /* BIGGER + BOLDER */
.content{flex:1;display:flex;flex-direction:column;justify-content:center;padding:0 5px} /* CENTER BUT COMPACT */
.content h1{font-size:38px;font-weight:900;line-height:1.15;margin:0 0 14px 0;color:#000;text-align:center;letter-spacing:-0.5px} /* HUGE + TIGHT */
.content p{font-size:22px;line-height:1.4;color:#000;margin:0 0 18px 0;font-weight:800;text-align:center} /* BIG TINY LINE + BOLD */
.dots{display:flex;justify-content:center;gap:8px;margin:8px 0 0 0}
.dot{width:10px;height:10px;background:#777;border-radius:50%}
.dot.active{background:#000;width:28px;border-radius:14px}
.bottom{padding:0 0 10px 0} /* BUTTONS CLOSE TO BOTTOM */
button{width:100%;padding:19px;margin-bottom:10px;border-radius:15px;font-size:21px;font-weight:900;border:none;letter-spacing:0.2px} /* BIGGEST + BOLD */
.btn1{background:#000;color:#fff}
.btn2{background:#fff;color:#000;border:2px solid #000}
</style>
</head>
<body>

<div class="wrap">
  <div class="top">
    <h2>hendchi</h2>
  </div>

  <div class="content">
    <h1>Get Paid in Pi for<br>Completing Social Tasks</h1>
    <p>Earn daily Pi by completing social tasks, posting adverts, watching ads and referring friends for top businesses and brands.</p>
    <div class="dots"><div class="dot active"></div><div class="dot"></div><div class="dot"></div><div class="dot"></div></div>
  </div>

  <div class="bottom">
    <button class="btn1" onclick="alert('Pi Login coming')">SIGN IN WITH PI</button>
    <a href="home.html" style="text-decoration:none"><button class="btn2">CONTINUE AS GUEST</button></a>
  </div>
</div>

</body>
</html>
