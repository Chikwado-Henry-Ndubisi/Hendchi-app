<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hendchi - Earn Daily Pi</title>
  <script src="https://sdk.minepi.com/pi-sdk.js"></script>
  <style>
    body { font-family: Arial; background: #f5f5f5; text-align: center; padding: 50px 20px; }
    .container { background: white; max-width: 400px; margin: auto; padding: 30px; border-radius: 15px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
    h1 { color: #6b21a8; }
    button { background: #6b21a8; color: white; border: none; padding: 15px 30px; font-size: 16px; border-radius: 10px; cursor: pointer; width: 100%; margin-top: 20px; }
    button:disabled { background: #ccc; }
    #status { margin-top: 15px; font-weight: bold; }
  </style>
</head>
<body>
  <div class="container">
    <h1>Get Paid in Pi</h1>
    <p>Earn daily Pi by posting adverts and performing simple social tasks</p>
    <button id="login-btn">LOGIN WITH PI</button>
    <p id="status"></p>
  </div>

  <script>
    // 1. Initialize Pi SDK
    Pi.init({ version: "2.0" });

    // 2. When button is clicked
    document.getElementById("login-btn").onclick = async function() {
      document.getElementById("status").innerText = "Connecting to Pi Wallet...";
      document.getElementById("login-btn").disabled = true;
      
      try {
        // 3. This is what Pi looks for during verification
        const auth = await Pi.authenticate(['username', 'payments'], onIncompletePaymentFound);
        
        // 4. If login success
        document.getElementById("status").innerText = "Success! Welcome " + auth.user.username;
        document.getElementById("status").style.color = "green";
        
      } catch (error) {
        document.getElementById("status").innerText = "Login failed. Please try again.";
        document.getElementById("status").style.color = "red";
        document.getElementById("login-btn").disabled = false;
      }
    };

    function onIncompletePaymentFound(payment) {
      console.log("Incomplete payment:", payment);
    }
  </script>
</body>
  </html>
