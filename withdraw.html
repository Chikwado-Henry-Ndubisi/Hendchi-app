<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Withdraw - Hendchi</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial;background:#f1f1f1;padding-bottom:120px}
.header{background:#6B21A8;color:#fff;padding:25px;font-size:36px;font-weight:900;text-align:center;position:sticky;top:0}
.box{background:#fff;padding:30px 20px;border-radius:20px;margin:20px}
.balance-show{text-align:center;margin-bottom:30px}
.balance-label{font-size:22px;color:#666;font-weight:900}
.balance{font-size:55px;font-weight:900;color:#6B21A8;margin:10px 0}
.rate-box{background:#EDE9FE;padding:20px;border-radius:15px;text-align:center;margin-bottom:20px}
.rate{font-size:24px;font-weight:900;color:#6B21A8}
label{font-size:22px;font-weight:900;display:block;margin-top:20px}
input{width:100%;padding:25px;font-size:24px;border:3px solid #ddd;border-radius:12px;margin-top:10px}
.btn{background:#6B21A8;color:#fff;border:none;padding:25px;width:100%;font-size:26px;font-weight:900;border-radius:18px;margin-top:25px;cursor:pointer}
.btn:disabled{background:#ccc}
.note{font-size:20px;color:#666;text-align:center;margin-top:15px;line-height:1.8}
.min-box{background:#FEF3C7;color:#92400E;padding:15px;border-radius:12px;font-size:20px;font-weight:900;text-align:center;margin-bottom:20px}
.history{background:#fff;padding:25px;margin:20px;border-radius:18px}
.history h3{font-size:26px;font-weight:900}
.history-item{border-bottom:1px solid #eee;padding:15px 0;font-size:20px}
.status{float:right;font-weight:900}
.status.pending{color:#F59E0B}
.status.paid{color:#16a34a}
.bottom-nav{position:fixed;bottom:0;left:0;right:0;background:#fff;display:flex;justify-content:space-around;padding:15px 0;border-top:3px solid #ddd;z-index:10}
.nav-item{font-size:18px;color:#666;text-align:center;cursor:pointer;font-weight:900}
.nav-item.active{color:#6B21A8}
.nav-icon{font-size:32px;display:block}
</style>
</head>
<body>
<div class="header">PLACE WITHDRAWALS</div>

<div class="box">
<div class="balance-show">
<div class="balance-label">YOUR POINTS BALANCE</div>
<div class="balance"><span id="balance">0.00</span> Points</div>
</div>

<div class="min-box">MINIMUM: 100 Points = 0.9 Pi</div>

<div class="rate-box">
<div class="rate">RATE: 100 Points = 0.9 Pi</div>
</div>

<label>POINTS TO WITHDRAW</label>
<input type="number" id="pointsInput" placeholder="Enter Points">
<div class="balance-label">You will get: <span id="piAmount">0.000</span> Pi</div>

<label>PI WALLET ADDRESS</label>
<input type="text" id="piWallet" placeholder="Enter your Pi Wallet Address">

<button class="btn" onclick="requestWithdraw()">SUBMIT REQUEST</button>

<div class="note">*Withdrawals processed within 24-48 hours<br>*Make sure wallet address is correct</div>
</div>

<div class="history">
<h3>WITHDRAWAL HISTORY</h3>
<div class="history-item">150 Points <span class="status pending">PENDING</span></div>
<div class="history-item">100 Points <span class="status paid">PAID</span></div>
</div>

<div class="bottom-nav">
<div class="nav-item" onclick="window.location.href='index.html'"><span class="nav-icon">🏠</span>HOME</div>
<div class="nav-item" onclick="window.location.href='earn.html'"><span class="nav-icon">💰</span>EARN</div>
<div class="nav-item" onclick="window.location.href='advertise.html'"><span class="nav-icon">➕</span>ADVERTISE</div>
<div class="nav-item" onclick="window.location.href='marketplace.html'"><span class="nav-icon">🏪</span>MARKET</div>
<div class="nav-item active"><span class="nav-icon">☰</span>MORE</div>
</div>

<script>
// Load balance
window.onload = function() {
  let points = parseFloat(localStorage.getItem('points')) || 2450;
  document.getElementById('balance').innerText = points.toFixed(2);
  
  document.getElementById('pointsInput').oninput = function() {
    let points = parseFloat(this.value) || 0;
    let pi = (points / 100) * 0.9;
    document.getElementById('piAmount').innerText = pi.toFixed(3);
  }
}

function requestWithdraw() {
  let points = parseFloat(document.getElementById('pointsInput').value);
  let wallet = document.getElementById('piWallet').value;
  
  if(!points || points < 100) {
    alert('Minimum withdrawal is 100 Points = 0.9 Pi');
    return;
  }
  
  let current = parseFloat(localStorage.getItem('points')) || 2450;
  if(points > current) {
    alert('Insufficient Points Balance');
    return;
  }
  
  if(wallet == '') {
    alert('Please enter your Pi Wallet Address');
    return;
  }
  
  // Deduct points
  let newBalance = current - points;
  localStorage.setItem('points', newBalance);
  
  let piAmount = (points / 100) * 0.9;
  
  alert('Withdrawal Request Sent!\n\n' + points + ' Points = ' + piAmount.toFixed(3) + ' Pi\nIt will be sent to: ' + wallet + '\nProcessing: 24-48 Hours');
  
  // Refresh page
  location.reload();
}
</script>
</body>
</html>
