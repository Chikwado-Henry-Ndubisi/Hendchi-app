<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login - Hendchi</title>
<style>
body{margin:0;font-family:Arial;background:#f1f1f1;padding:30px}
.box{background:#fff;padding:40px 25px;border-radius:20px;max-width:600px;margin:80px auto}
.logo{color:#6B21A8;font-size:50px;font-weight:900;text-align:center}
h1{font-size:38px;font-weight:900;text-align:center;margin:20px 0}
input{width:100%;padding:25px;font-size:24px;border:3px solid #ddd;border-radius:15px;margin:15px 0;box-sizing:border-box}
.btn{background:#6B21A8;color:#fff;border:none;padding:28px;width:100%;font-size:26px;font-weight:900;border-radius:18px;margin-top:20px}
.link{text-align:center;font-size:22px;margin-top:25px}
.link a{color:#6B21A8;font-weight:900;text-decoration:none}
</style>
</head>
<body>

<div class="box">
  <div class="logo">hendchi.π</div>
  <h1>Welcome Back</h1>
  
  <input type="email" placeholder="Email Address">
  <input type="password" placeholder="Password">
  
  <button class="btn" onclick="window.location.href='dashboard.html'">Login</button>
  
  <div class="link">Don't have an account? <a href="signup.html">Sign Up</a></div>
</div>

</body>
</html>
