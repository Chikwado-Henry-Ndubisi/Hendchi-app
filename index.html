<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hendchi.pi</title>
<script src="https://sdk.minepi.com/pi-sdk.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Segoe UI',Arial,sans-serif}
.page{min-height:100vh;display:flex;flex-direction:column;justify-content:center;align-items:center;padding:30px 20px;text-align:center;transition:0.3s}
.hidden{display:none}
/* LANDING - WHITE */
#landing{background:#fff;color:#111}
#landing h1{color:#6a0dad;font-size:32px;margin-bottom:10px;font-weight:800}
#landing h2{font-size:22px;margin-bottom:10px}
#landing p{color:#666;margin-bottom:30px}
.btn{padding:16px;border-radius:14px;width:90%;max-width:400px;margin:10px auto;border:none;font-size:17px;font-weight:bold;cursor:pointer}
.btn-purple{background:#6a0dad;color:#fff}
.btn-outline{background:#fff;color:#6a0dad;border:2px solid #6a0dad}
/* LOGIN - PURPLE GRADIENT */
#login{background:linear-gradient(135deg,#6a0dad 0%,#8e44ad 100%);color:#fff}
#login h1{font-size:28px;margin-bottom:8px}
#login p{opacity:0.9;margin-bottom:30px}
.btn-yellow{background:#FFD700;color:#000}
.btn-white{background:#fff;color:#6a0dad}
/* DASHBOARD - LIGHT */
#dashboard{background:#f7f7f7;color:#111}
#dashboard h1{margin-bottom:10px}
.balance{font-size:18px;color:#6a0dad;font-weight:bold;margin-bottom:30px}
.btn-dash{background:#6a0dad;color:#fff}
.loading{font-size:14px;opacity:0.8}
</style>
</head>
<body>

<!-- PAGE 1: WHITE LANDING -->
<div class="page" id="landing">
<h1>hendchi.pi</h1>
<h2>Get Paid for Posting Adverts Daily</h2>
<p>Grow Your Business • Go Viral • Sell Faster</p>
<button class="btn btn-purple" onclick="showPage('login')">CREATE FREE ACCOUNT</button>
<button class="btn btn-outline" onclick="showPage('login')">LOGIN TO YOUR ACCOUNT</button>
</div>

<!-- PAGE 2: PURPLE LOGIN -->
<div class="page hidden" id="login">
<h1>Welcome to Hendchi</h1>
<p>Earn Pi • Withdraw Pi • Shop with Pi</p>
<button class="btn btn-white">CREATE ACCOUNT</button>
<button class="btn btn-yellow" onclick="piLogin()">LOGIN WITH PI</button>
<p class="loading" id="loadingText"></p>
</div>

<!-- PAGE 3: DASHBOARD -->
<div class="page hidden" id="dashboard">
<h1>Dashboard</h1>
<p class="balance">Welcome Boss! Your Pi Balance: <span id="piBalance">0.00</span> π</p>
<button class="btn btn-dash">Earn Pi</button>
<button class="btn btn-dash">Withdraw Pi</button>
<button class="btn btn-dash">Marketplace</button>
</div>

<script>
// Initialize Pi SDK
Pi.init({ version: "2.0", sandbox: true }); // change sandbox:false when going live

function showPage(pageId){
  document.querySelectorAll('.page').forEach(p => p.classList.add('hidden'));
  document.getElementById(pageId).classList.remove('hidden');
}

function piLogin(){
  document.getElementById('loadingText').innerText = "Connecting to Pi...";
  const scopes = ['username', 'payments'];
  
  Pi.authenticate(scopes, function(payment){
    console.log("Incomplete payment:", payment);
  }).then(function(auth){
    document.getElementById('loadingText').innerText = "";
    document.getElementById('piBalance').innerText = "10.50"; // demo balance. Replace with real API later
    showPage('dashboard');
    alert("Welcome " + auth.user.username + "!");
  }).catch(function(error){
    document.getElementById('loadingText').innerText = "";
    alert("Login failed: " + error);
  });
}
</script>
</body>
  </html>
