<!DOCTYPE html>
<html>
<head><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hendchi</title>
<style>
body{margin:0;font-family:Arial;background:#f5f5f5;padding-bottom:60px}
.header{background:#6B21A8;color:#fff;padding:20px}
.balance{background:#fff;margin:15px;padding:20px;border-radius:12px}
.balance h2{font-size:36px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:15px;padding:0 15px}
.card{background:#fff;padding:15px;border-radius:12px}
.big-btn{background:#000;color:#fff;text-align:center;padding:18px;margin:20px;border-radius:12px;font-weight:900}
.nav{position:fixed;bottom:0;width:100%;background:#fff;display:flex;justify-content:space-around;padding:10px 0}
</style>
</head>
<body>
<div class="header"><h1>Welcome to Hendchi 👋</h1></div>
<div class="balance"><small>Your Pi Balance</small><h2>0.000 <span style="color:#F59E0B">π</span></h2></div>
<div class="grid">
<div class="card"><h3>📋 Tasks</h3><p>12 Available FREE</p></div>
<div class="card"><h3>📺 Watch Ads</h3><p>Earn 0.01π</p></div>
<div class="card"><h3>👥 Referrals</h3><p>0 Friends</p></div>
<div class="card"><h3>💰 Wallet</h3><p>Withdraw Pi</p></div>
</div>
<div class="big-btn">CLAIM DAILY TASK<br>+0.001π</div>
<div class="nav"><div><b>Home</b></div><div>Tasks</div><div>Wallet</div><div>Profile</div></div>
</body>
</html>
