<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hendchi - Earn Daily Pi</title>
  <script src="https://sdk.minepi.com/pi-sdk.js"></script>
</head>
<body style="font-family:Arial; text-align:center; padding:50px 20px;">
  <h1 style="color:#6b21a8;">Get Paid in Pi</h1>
  <p>Earn daily Pi by posting adverts and performing simple social tasks</p>
  <button id="login" style="background:#6b21a8; color:white; border:none; padding:15px 30px; border-radius:10px; font-size:16px;">LOGIN WITH PI</button>
  <p id="status"></p>

  <script>
    Pi.init({ version: "2.0" });
    
    document.getElementById("login").onclick = function() {
      Pi.authenticate(['username'], function(auth) {
        document.getElementById("status").innerHTML = "Logged in as " + auth.user.username;
      }).catch(function(error) {
        alert("Login failed");
      });
    };
  </script>
</body>
  </html>
