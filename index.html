<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboard - Hendchi</title>
<style>
body{margin:0;font-family:Arial;background:#f1f1f1;padding-bottom:110px;font-size:22px}
.header{background:#fff;padding:25px;display:flex;justify-content:space-between;align-items:center;border-bottom:2px solid #ddd}
.logo{color:#6B21A8;font-size:34px;font-weight:900}
.header-icons{font-size:32px}
.welcome{background:#fff;padding:25px;font-size:24px;font-weight:900;display:flex;justify-content:space-between}
.logout{color:#6B21A8}
.alert{background:#dbeafe;color:#1e3a8a;padding:25px;font-size:22px;line-height:1.8}
.balance-box{background:#fff;padding:50px 20px;text-align:center}
.balance-label{font-size:24px;color:#666;font-weight:900}
.balance{font-size:70px;font-weight:900;margin:20px 0}
.btn{border:3px solid #ddd;background:#fff;padding:20px 40px;font-size:24px;font-weight:900;border-radius:15px;margin:10px}
.btn-buy{color:#6B21A8;font-size:23px;font-weight:900}
.stats{display:flex;justify-content:space-around;background:#fff;padding:30px}
.stat-label{font-size:21px;color:#666;font-weight:900}
.stat-value{font-size:25px;font-weight:900}
.member-box{background:#fff;padding:50px 20px;text-align:center}
.member-title{font-size:30px;font-weight:900}
.member-text{font-size:22px;line-height:1.9}
.badge{background:#16a34a;color:#fff;padding:18px 30px;border-radius:40px;font-size:22px;font-weight:900}
.btn-primary{background:#6B21A8;color:#fff;border:none;padding:25px 40px;font-size:25px;font-weight:900;border-radius:18px;width:90%}
.cards{display:flex;gap:20px;padding:20px}
.card{background:#fff;padding:30px;border-radius:20px;font-size:22px;font-weight:900;width:50%}
.card .link{color:#6B21A8;font-size:22px}
.section{background:#fff;padding:30px;margin:15px 0}
.section h2{font-size:30px;font-weight:900}
.nav{position:fixed;bottom:0;left:0;width:100%;background:#fff;display:flex;justify-content:space-around;padding:15px 0;border-top:3px solid #ddd;height:100px;z-index:999}
.nav-item{text-align:center;font-size:20px;color:#444;font-weight:900;flex:1}
.nav-icon{font-size:38px;display:block;margin-bottom:5px}
</style>
</head>
<body>
...PASTE YOUR SAME DASHBOARD CONTENT HERE...
</body>
</html>
