<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hendchi</title>
<script src="https://sdk.minepi.com/pi-sdk.js"></script>
<style>
* {margin:0; padding:0; box-sizing:border-box; font-family: Arial, sans-serif;}
body {background:#fff; position:relative; overflow-x:hidden;}
/* ARRANGED BACKGROUND WATERMARK */
body::before {
  content:"";
  position:fixed;
  top:50%;
  left:50%;
  transform:translate(-50%, -50%);
  width:280px;
  height:280px;
  background:url('data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><rect x="10" y="10" width="30" height="30" rx="8" fill="%23ff3b30"/><text x="50" y="60" font-family="Arial" font-size="20" font-weight="900" fill="%236b21a8">hendchi</text></svg>') no-repeat center;
  background-size:contain;
  opacity:0.05;
  z-index:0;
}
.page {display:none; width:100%; min-height:100vh; position:relative; z-index:1;}
.active {display:block;}
.top {padding:18px 20px; display:flex; justify-content:space-between; align-items:center;}
.logo {display:flex; align-items:center; gap:8px; color:#6b21a8; font-size:21px; font-weight:900;}
.logo-icon {width:26px; height:26px; background:#ff3b30; border-radius:6px 0 6px 0;}
.content {padding:70px 25px 20px; text-align:center;}
.content h2 {font-size:27px; color:#000; line-height:1.35; margin-bottom:14px; font-weight:900;}
.content p {font-size:15px; color:#666; line-height:1.6; font-weight:500;}
.dots {display:flex; justify-content:center; gap:8px; margin:35px 0 45px;}
.dot {width:9px; height:9px; background:#d0d0d0; border-radius:50%;}
.dot.active {width:26px; background:#6b21a8; border-radius:13px;}
.bottom {padding:0 25px 50px;}
/* ARRANGED BOLD BUTTONS */
.btn1 {width:100%; padding:17px; background:#6b21a8; color:#fff; border:none; border-radius:12px; font-size:16px; font-weight:900; margin-bottom:14px; text-transform:uppercase; letter-spacing:0.5px; box-shadow:0 4px 12px rgba(107,33,168,0.25);}
.btn2 {width:100%; padding:17px; background:#fff; color:#6b21a8; border:2.5px solid #6b21a8; border-radius:12px; font-size:16px; font-weight:900; text-transform:uppercase; letter-spacing:0.5px;}
#home {background:#f5f5f5; padding:20px;}
#home h1 {font-size:24px;}
.card {background:linear-gradient(135deg,#6b21a8,#9333ea); color:#fff; padding:25px; border-radius:20px; text-align:center; margin-top:20px;}
</style>
</head>
<body>

<div id="onboard" class="page active">
  <div class="top">
    <div class="logo"><div class="logo-icon"></div>hendchi</div>
    <div style="font-size:24px; font-weight:900;">☰</div>
  </div>
  <div class="content">
    <h2 id="title">Get Paid for<br>Posting Adverts Daily<br>on Your Social Media</h2>
    <p id="text">Earn daily Pi by posting adverts and performing simple social tasks</p>
    <div class="dots"><span class="dot active"></span><span class="dot"></span><span class="dot"></span><span class="dot"></span></div>
  </div>
  <div class="bottom">
    <button class="btn1" onclick="piLogin()">CREATE FREE ACCOUNT</button>
    <button class="btn2" onclick="piLogin()">LOGIN TO YOUR ACCOUNT</button>
  </div>
</div>

<div id="home" class="page">
  <h1>Welcome <span id="user">Pioneer</span> 👋</h1>
  <div class="card"><h2>Your Pi Balance</h2><h3>0.000 π</h3></div>
</div>

<script>
window.addEventListener('load', function() {window.Pi.init({ version: "2.0", sandbox: true });});
let n=0, timer;
const data=[
 {t:"Get Paid for<br>Posting Adverts Daily<br>on Your Social Media",p:"Earn daily Pi by posting adverts and performing simple social tasks"},
 {t:"Get People to Post<br>Your Adverts on<br>their Social Media",p:"Get people with atleast 1,000 followers to post your adverts"},
 {t:"Boost Your Social<br>Media Engagement<br>and Portfolio",p:"Get real people to grow your social media portfolio"},
 {t:"Sell Faster on<br>Hendchi Marketplace",p:"Take advantage of our huge web traffic and sell your products faster"}
];
function show(id){document.querySelectorAll('.page').forEach(x=>x.classList.remove('active'));document.getElementById(id).classList.add('active')}
function slide(){n=(n+1)%4;document.getElementById('title').innerHTML=data[n].t;document.getElementById('text').innerText=data[n].p;document.querySelectorAll('.dot').forEach((d,i)=>d.className='dot'+(i==n?' active':''))}
timer=setInterval(slide,3000);
function piLogin(){clearInterval(timer);window.Pi.authenticate(['username', 'payments'], function(payment) {}, function(error) {alert("Login cancelled");timer=setInterval(slide,3000)}).then(function(auth) {document.getElementById('user').innerText = auth.user.username;show('home')});}
</script>
</body>
</html>
