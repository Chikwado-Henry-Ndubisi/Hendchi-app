<!DOCTYPE html>
<html>
<head>
  <title>Hendchi</title>
  <style>
    body { margin:0; font-family:Arial; }
    .page { min-height:100vh; padding:20px; text-align:center; }
    .hidden { display:none; }
    
    /* WHITE LANDING PAGE */
    #landing { background:white; color:black; }
    #landing h1 { color:#6a0dad; }
    .btn-purple { background:#6a0dad; color:white; padding:15px; border:none; border-radius:10px; width:80%; margin:10px; }
    .btn-white { background:white; color:#6a0dad; padding:15px; border:2px solid #6a0dad; border-radius:10px; width:80%; margin:10px; }

    /* PURPLE LOGIN PAGE */
    #login { background: linear-gradient(135deg, #6a0dad, #9b59b6); color:white; }
    .btn-yellow { background:yellow; color:black; padding:15px; border:none; border-radius:10px; width:80%; margin:10px; }
    .btn-white2 { background:white; color:#6a0dad; padding:15px; border:none; border-radius:10px; width:80%; margin:10px; }
  </style>
</head>
<body>

<!-- PAGE 1: WHITE LANDING PAGE -->
<div class="page" id="landing">
  <h1>hendchi.pi</h1>
  <h2>Get Paid for Posting Adverts Daily</h2>
  <p>Grow Your Business • Go Viral • Sell Faster</p>
  <button class="btn-purple" onclick="showLogin()">CREATE FREE ACCOUNT</button>
  <button class="btn-white" onclick="showLogin()">LOGIN TO YOUR ACCOUNT</button>
</div>


<!-- PAGE 2: PURPLE LOGIN PAGE -->
<div class="page hidden" id="login">
  <h1>Welcome to Hendchi</h1>
  <p>Earn Pi • Withdraw Pi • Shop with Pi</p>
  <button class="btn-white2">CREATE ACCOUNT</button>
  <button class="btn-yellow">LOGIN WITH PI</button>
</div>


<script>
function showLogin() {
  document.getElementById('landing').classList.add('hidden'); // hide white
  document.getElementById('login').classList.remove('hidden'); // show purple
}
</script>

</body>
</html>
