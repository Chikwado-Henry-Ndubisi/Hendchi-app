<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hendchi</title>
<script src="https://sdk.minepi.com/pi-sdk.js"></script>
<style>
* {margin:0; padding:0; box-sizing:border-box; font-family: Arial, sans-serif;}
body {background:#fff; overflow:hidden;}
.page {display:none; width:100%; height:100vh;}
.active {display:flex; flex-direction:column;}

#splash {background:#7B2FFF; justify-content:center; align-items:center;}
#splash h1 {color:#fff; font-size:36px; display:flex; align-items:center; gap:8px; font-weight:900;}
.logo-c {width:32px; height:32px; background:#ff3b30; border-radius:50% 0 0 50%;}

#loading {background:#f5f5f5; justify-content:center; align-items:center;}
.spinner {border:5px solid #e0e0e0; border-top:5px solid #7B2FFF; border-radius:50%; width:45px; height:45px; animation:spin 1s linear infinite;}
@keyframes spin {to {transform:rotate(360deg);}}

#onboard {background:#fff url('data:image/svg+xml;base64,PHN2ZyB3aWR0aD0iMjAwIiBoZWlnaHQ9IjIwMCIgdmlld0JveD0iMCAwIDIwMCAyMDAiIGZpbGw9Im5vbmUiIHhtbG5zPSJodHRwOi8vd3d3LnczLm9yZy8yMDAwL3N2ZyIgb3BhY2l0eT0iMC4wMyI+PGNpcmNsZSBjeD0iMTAwIiBjeT0iMTAwIiByPSI4MCIgZmlsbD0iIzdCMkZGRiIvPjwvc3ZnPg==') center center no-repeat; background-size:200px;}
.top {padding:20px; display:flex; justify-content:space-between; align-items:center;}
.logo {display:flex; align-items:center; gap:6px; color:#7B2FFF; font-size:22px; font-weight:900;}
.content {flex:1; padding:20px 30px; text-align:center; display:flex; flex-direction:column; justify-content:center;}
.content h2 {font-size:32px; color:#000; line-height:1.4; margin-bottom:16px; font-weight:900;}
.content p {font-size:21px; color:#444; line-height:1.8; font-weight:600;}
.content b {color:#7B2FFF; font-weight:900;}
.dots {display:flex; justify-content:center; gap:10px; margin-top:25px;}
.dot {width:10px; height:10px; background:#d0d0d0; border-radius:50%;}
.dot.active {width:28px; background:#7B2FFF; border-radius:14px;}
.bottom {padding:0 20px 40px;}
.btn1 {width:100%; padding:18px; background:#7B2FFF; color:#fff; border:none; border-radius:14px; font-size:19px; font-weight:900; margin-bottom:14px; letter-spacing:0.5px;}
.btn2 {width:100%; padding:18px; background:#fff; color:#7B2FFF; border:3px solid #7B2FFF; border-radius:14px; font-size:19px; font-weight:900; letter-spacing:0.5px;}

#home {background:#f5f5f5; padding:20px;}
#home h1 {font-size:26px; font-weight:900;}
.card {background:linear-gradient(135deg,#7B2FFF,#9333ea); color:#fff; padding:25px; border-radius:20px; text-align:center; margin-top:20px;}
.card h2 {font-size:18px; font-weight:700;}
.card h3 {font-size:40px; margin-top:8px; font-weight:900;}
</style>
</head>
<body>

<div id="splash" class="page active"><h1><div class="logo-c"></div>Hendchi</h1></div>
<div id="loading" class="page"><div class="spinner"></div></div>

<div id="onboard" class="page">
  <div class="top">
    <div class="logo"><div class="logo-c"></div>hendchi</div>
    <div style="font-size:24px;">☰</div>
  </div>
  <div class="content">
    <h2 id="title">Get People to Post Your <b>Adverts</b> on their <b>Social Media</b></h2>
    <p id="text">Get <b>people with 1,000+ followers</b> to post your <b>adverts</b></p>
    <div class="dots"><span class="dot"></span><span class="dot active"></span><span class="dot"></span><span class="dot"></span></div>
  </div>
  <div class="bottom">
    <button class="btn1" onclick="piLogin()">CREATE FREE ACCOUNT</button>
    <button class="btn2" onclick="piLogin()">LOGIN TO YOUR ACCOUNT</button>
  </div>
</div>

<div id="home" class="page">
  <h1>Welcome <span id="user">Pioneer</span> 👋</h1>
  <div class="card"><h2>Your Pi Balance</h2><h3>0.000 π</h3></div>
</div>

<script>
window.addEventListener('load', function() {
  window.Pi.init({ version: "2.0", sandbox: true });
});

let n=1, timer;
const data=[
 {t:"Get <b>Paid</b> for <b>Posting Adverts</b> Daily on Your <b>Social Media</b>",p:"<b>Earn daily Pi</b> by posting adverts and performing simple social tasks"},
 {t:"Get <b>People</b> to Post Your <b>Adverts</b> on their <b>Social Media</b>",p:"Get <b>people with 1,000+ followers</b> to post your <b>adverts</b>"},
 {t:"<b>Boost</b> Your <b>Social Media</b> <b>Engagement</b> and <b>Portfolio</b>",p:"Get <b>real people</b> to grow your social media portfolio"},
 {t:"<b>Sell Faster</b> on Hendchi <b>Marketplace</b>",p:"Take advantage of our <b>huge web traffic</b> and <b>sell your products faster</b>"}
];
function show(id){document.querySelectorAll('.page').forEach(x=>x.classList.remove('active'));document.getElementById(id).classList.add('active')}
function slide(){n=(n+1)%4;document.getElementById('title').innerHTML=data[n].t;document.getElementById('text').innerHTML=data[n].p;document.querySelectorAll('.dot').forEach((d,i)=>d.className='dot'+(i==n?' active':''))}
setTimeout(()=>show('loading'),2000);
setTimeout(()=>{show('onboard');timer=setInterval(slide,3000)},3000);

function piLogin(){
  clearInterval(timer);
  window.Pi.authenticate(['username'],
    function(auth) {
      document.getElementById('user').innerText = auth.user.username;
      show('home')
    },
    function(error) {
      alert("Login cancelled");
      timer=setInterval(slide,3000)
    }
  );
}
</script>
</body>
  </html>
