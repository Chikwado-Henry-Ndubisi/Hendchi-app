<!DOCTYPE html>
<html>
<head>
<title>Hendchi.pi</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<script src="https://sdk.minepi.com/pi-sdk.js"></script>
<style>
body{margin:0;font-family:Arial;background:#fff}
.page{min-height:100vh;display:flex;flex-direction:column;justify-content:center;align-items:center;padding:20px;text-align:center}
.hidden{display:none}
#splash{background:#6a0dad;color:white}
#splash h1{font-size:40px}
#landing h2{color:#6a0dad;font-size:26px}
#landing p{color:#666;margin-bottom:30px}
.btn{width:90%;max-width:350px;padding:16px;margin:10px;border-radius:12px;border:none;font-size:16px;font-weight:bold}
.btn1{background:#6a0dad;color:white}
.btn2{background:white;color:#6a0dad;border:2px solid #6a0dad}
.overlay{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,.6);display:flex;justify-content:center;align-items:center}
.popup{background:white;padding:25px;border-radius:15px;width:90%;max-width:380px}
.popup h3{color:#6a0dad}
input{width:100%;padding:14px;margin:10px 0;border:1px solid #ddd;border-radius:10px}
#dashboard{background:#f5f5f5}
.balance{font-size:45px;color:#6a0dad;font-weight:bold}
</style>
</head>
<body>

<!-- 1. SPLASH -->
<div class="page" id="splash"><h1>🛒 hendchi</h1></div>

<!-- 2. LANDING - WHITE LIKE HAWKIT -->
<div class="page hidden" id="landing">
<h2>Get Paid for Posting Adverts Daily</h2>
<p>Earn Pi by posting adverts and performing simple social tasks</p>
<button class="btn btn1" onclick="showLogin()">CREATE FREE ACCOUNT</button>
<button class="btn btn2" onclick="showLogin()">LOGIN TO YOUR ACCOUNT</button>
</div>

<!-- 3. LOGIN POPUP -->
<div class="overlay hidden" id="login">
<div class="popup">
<h3>Log in to Hendchi</h3>
<input placeholder="Email or Username">
<input type="password" placeholder="Password">
<button class="btn btn1" onclick="goDash()">LOG IN</button>
<button class="btn btn2" onclick="piLogin()">LOGIN WITH PI</button>
</div>
</div>

<!-- 4. DASHBOARD -->
<div class="page hidden" id="dashboard">
<h2>Welcome!</h2>
<p>My Balance</p>
<div class="balance"><span id="bal">0.00</span> π</div>
<button class="btn btn1" onclick="alert('Tasks coming soon')">PERFORM TASKS</button>
</div>

<script>
Pi.init({version:"2.0",sandbox:true});
setTimeout(()=>{document.getElementById('splash').classList.add('hidden');document.getElementById('landing').classList.remove('hidden')},2000);
function showLogin(){document.getElementById('login').classList.remove('hidden')}
function goDash(){document.getElementById('login').classList.add('hidden');document.getElementById('dashboard').classList.remove('hidden')}
async function piLogin(){const a=await Pi.authenticate(['username','payments']);document.getElementById('bal').innerText="10.50";goDash()}
</script>
</body>
</html>
