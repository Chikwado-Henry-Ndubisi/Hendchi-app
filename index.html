<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Hendchi</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;background:#fff;color:#000;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial;overflow:hidden}
.wrap{display:flex;flex-direction:column;height:100vh;padding:2vh 5vw;justify-content:space-between}
.top{text-align:center;padding-top:0.5vh}
.top h2{font-size:7vh;font-weight:900;color:#000;letter-spacing:-1px} /* WAS 7.5vh */
.content{display:flex;flex-direction:column;justify-content:center}
.content h1{font-size:6vh;font-weight:900;line-height:1.1;margin:0 0 1.5vh 0;color:#000;text-align:center} /* WAS 6.5vh */
.content p{font-size:3vh;line-height:1.35;color:#000;margin:0 0 1.5vh 0;font-weight:700;text-align:center} /* WAS 3.2vh */
.dots{display:flex;justify-content:center;gap:1.5vw;margin:0.8vh 0}
.dot{width:2.2vw;height:2.2vw;background:#999;border-radius:50%}
.dot.active{background:#000;width:6vw;border-radius:4vw}
.bottom{padding-bottom:4vh} /* BROUGHT UP MORE */
button{width:100%;padding:2.2vh;margin-bottom:1.2vh;border-radius:3vw;font-size:4vh;font-weight:900;border:none} /* WAS 4.2vh */
.btn1{background:#000;color:#fff}
.btn2{background:#fff;color:#000;border:0.5vw solid #000}
</style>
</head>
<body>

<div class="wrap">
  <div class="top">
    <h2>hendchi</h2>
  </div>

  <div class="content">
    <h1>Get Paid in Pi for<br>Completing Social Tasks</h1>
    <p>Earn daily Pi by completing social tasks, posting adverts, watching ads and referring friends for top businesses and brands.</p>
    <div class="dots"><div class="dot active"></div><div class="dot"></div><div class="dot"></div><div class="dot"></div></div>
  </div>

  <div class="bottom">
    <button class="btn1" onclick="alert('Pi Login coming')">SIGN IN WITH PI</button>
    <a href="home.html" style="text-decoration:none"><button class="btn2">CONTINUE AS GUEST</button></a>
  </div>
</div>

</body>
</html>
