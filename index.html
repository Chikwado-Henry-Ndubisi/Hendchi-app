<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Hendchi</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;background:#fff;color:#000;font-family:Arial Black, Arial, Helvetica, sans-serif;overflow-y:auto}
.wrap{display:flex;flex-direction:column;min-height:100%;padding:10px 15px}
.top{text-align:center;padding:5px 0 15px 0}
.top h2{font-size:44px;font-weight:900;color:#000;letter-spacing:-1px} /* GIANT HENDCHI */
.content{flex:1;display:flex;flex-direction:column;justify-content:center;padding:20px 0} /* GO UP AND DOWN */
.content h1{font-size:42px;font-weight:900;line-height:1.1;margin:0 0 18px 0;color:#000;text-align:center;letter-spacing:-1px} /* HUGE GET PAID */
.content p{font-size:24px;line-height:1.4;color:#000;margin:0 0 25px 0;font-weight:900;text-align:center} /* GIANT DESCRIPTION 5X BOLDER */
.dots{display:flex;justify-content:center;gap:10px;margin:15px 0}
.dot{width:12px;height:12px;background:#666;border-radius:50%}
.dot.active{background:#000;width:32px;border-radius:16px}
.bottom{padding:10px 0 20px 0}
button{width:100%;padding:22px;margin-bottom:14px;border-radius:16px;font-size:24px;font-weight:900;border:none;letter-spacing:0.5px;text-transform:uppercase} /* 5X BOLDER BUTTONS */
.btn1{background:#000;color:#fff}
.btn2{background:#fff;color:#000;border:3px solid #000}
</style>
</head>
<body>

<div class="wrap">
  <div class="top">
    <h2>hendchi</h2>
  </div>

  <div class="content">
    <h1>Get Paid in Pi for<br>Completing Social Tasks</h1>
    <p>Earn daily Pi by completing social tasks, posting adverts, watching ads and referring friends for top businesses and brands.</p>
    <div class="dots"><div class="dot active"></div><div class="dot"></div><div class="dot"></div><div class="dot"></div></div>
  </div>

  <div class="bottom">
    <button class="btn1" onclick="alert('Pi Login coming')">SIGN IN WITH PI</button>
    <a href="home.html" style="text-decoration:none"><button class="btn2">CONTINUE AS GUEST</button></a>
  </div>
</div>

</body>
</html>
