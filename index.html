<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
<title>Dashboard - Hendchi</title>
<style>
*{box-sizing:border-box}
html{font-size:24px}
body{margin:0;font-family:'Segoe UI',Arial,sans-serif;background:#f1f1f1;padding-bottom:120px;font-size:1rem}
.header{background:#fff;padding:24px 26px;display:flex;justify-content:space-between;align-items:center;border-bottom:3px solid #e5e5e5;position:sticky;top:0;z-index:999}
.logo{color:#6B21A8;font-size:1.6rem;font-weight:900}
.logo span{color:#000;font-size:1rem}
.header-icons{display:flex;gap:32px;font-size:1.6rem}
.header-icons span{cursor:pointer}

.welcome{background:#fff;padding:24px 26px;display:flex;justify-content:space-between;align-items:center;font-size:1rem;font-weight:900;border-bottom:2px solid #f0f0f0}
.logout{color:#6B21A8;font-size:0.95rem;font-weight:900;cursor:pointer}

.alert{background:#dbeafe;color:#1e3a8a;padding:24px 26px;font-size:0.95rem;line-height:2.1}
.alert a{color:#1e3a8a;font-weight:900;text-decoration:underline}

.balance-box{background:#fff;padding:45px 26px;text-align:center}
.balance-label{font-size:1.05rem;color:#666;margin-bottom:18px;font-weight:900}
.balance{font-size:2.8rem;font-weight:900;margin:18px 0}
.btn-row{display:flex;gap:22px;justify-content:center;margin:28px 0}
.btn{background:#fff;border:4px solid #ddd;padding:22px 40px;border-radius:18px;font-size:1rem;font-weight:900;cursor:pointer}
.btn-buy{color:#6B21A8;font-size:0.95rem;font-weight:900;cursor:pointer;margin-top:18px}

.stats{display:flex;justify-content:space-around;background:#fff;padding:28px 18px;margin:18px 0}
.stat{text-align:center}
.stat-label{font-size:0.9rem;color:#666;font-weight:900}
.stat-value{font-size:1.1rem;font-weight:900;margin-top:12px}

.member-box{background:#fff;padding:45px 26px;margin:18px 0;text-align:center}
.member-icon{font-size:3.5rem;margin-bottom:18px}
.member-title{font-size:1.3rem;font-weight:900;margin:22px 0}
.member-text{font-size:1rem;color:#444;line-height:2.2;margin:22px 0}
