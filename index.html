<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<link rel="stylesheet" href="style.css">
<title>Hendchi</title>
<script src="https://sdk.minepi.com/pi-sdk.js"></script>
</head>
<body>
  <div class="full-page">
    
    <div class="header">
      <h2 class="app-name">Hendchi</h2>
    </div>
    
    <div class="content">
      <h1>Earn Pi by Completing <br>Tasks Daily</h1>
      <p>Earn daily Pi by completing simple tasks, watching ads and referring friends on your Pi account.</p>
      
      <div class="dots">
        <span class="dot active"></span>
        <span class="dot"></span>
        <span class="dot"></span>
      </div>
    </div>
    
    <div class="button-area">
      <button class="btn-main" onclick="loginWithPi()">SIGN IN WITH PI</button>
      <a href="home.html" class="btn-outline">CONTINUE AS GUEST</a>
    </div>
    
  </div>

<script>
Pi.init({ version: "2.0", sandbox: true });

function loginWithPi() {
  const scopes = ['username', 'payments'];
  Pi.authenticate(scopes, function(payment) {
    console.log('incomplete payment found', payment);
  })
  .then(function(auth) {
    alert("Welcome " + auth.user.username + "!");
    window.location.href = "home.html";
  })
  .catch(function(error) {
    alert("Login failed: " + error);
  });
}
</script>

</body>
</html>
