<!DOCTYPE html><html><head><meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0"><title>Hendchi</title><style>*{box-sizing:border-box}body{margin:0;font-family:Arial;background:#f1f1f1;padding-bottom:130px}.header{background:#6B21A8;color:#fff;padding:30px;font-size:38px;font-weight:900;text-align:center;position:sticky;top:0;z-index:10}.box{background:#fff;padding:35px 25px;border-radius:22px;margin:25px;text-align:center}.balance{font-size:60px;font-weight:900;color:#6B21A8;margin:15px 0}.btn{background:#6B21A8;color:#fff;border:none;padding:28px;width:100%;font-size:28px;font-weight:900;border-radius:20px;margin-top:20px;cursor:pointer}.bottom-nav{position:fixed;bottom:0;left:0;right:0;background:#fff;display:flex;justify-content:space-around;padding:20px 0;border-top:4px solid #ddd;z-index:10}.nav-item{font-size:22px;color:#666;text-align:center;cursor:pointer;font-weight:900}.nav-item.active{color:#6B21A8}.nav-icon{font-size:38px;display:block}</style></head><body><div class="header">HENDCHI</div><div class="box"><div style="font-size:24px;font-weight:900">YOUR POINTS</div><div class="balance"><span id="balance">2450.00</span></div><button class="btn" onclick="window.location.href='earn.html'">EARN MORE POINTS</button></div><div class="bottom-nav"><div class="nav-item active"><span class="nav-icon">🏠</span>HOME</div><div class="nav-item" onclick="window.location.href='earn.html'"><span class="nav-icon">💰</span>EARN</div><div class="nav-item" onclick="window.location.href='advertise.html'"><span class="nav-icon">➕</span>ADVERTISE</div><div class="nav-item" onclick="window.location.href='marketplace.html'"><span class="nav-icon">🏪</span>MARKET</div><div class="nav-item" onclick="window.location.href='more.html'"><span class="nav-icon">☰</span>MORE</div></div><script>window.onload=function(){let p=parseFloat(localStorage.getItem('points'))||2450;document.getElementById('balance').innerText=p.toFixed(2)}</script></body></html>
