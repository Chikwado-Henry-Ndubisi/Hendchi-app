<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Hendchi</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial;background:#fff;color:#000;text-align:center;height:100vh;display:flex;flex-direction:column;justify-content:space-between}
.top{padding-top:60px}
.top h2{font-size:30px;font-weight:900;color:#000;margin:0} /* BIG LIKE "Welcome to Pi" */
.middle{padding:0 25px}
.middle h1{font-size:32px;font-weight:900;line-height:1.3;margin:0 0 20px 0}
.middle p{font-size:16px;line-height:1.6;color:#555;margin:0 0 30px 0}
.dots{margin:20px 0}
.dot{display:inline-block;width:10px;height:10px;background:#ddd;border-radius:50%;margin:0 5px}
.dot.active{background:#000;width:26px;border-radius:13px}
.bottom{padding:20px 25px 30px 25px}
button{width:100%;padding:17px;margin-bottom:12px;border-radius:14px;font-size:18px;font-weight:800;border:none}
.btn1{background:#000;color:#fff}
.btn2{background:#fff;color:#000;border:2px solid #e0e0e0}
</style>
</head>
<body>

<div class="top">
  <h2>hendchi</h2>
</div>

<div class="middle">
  <h1>Get Paid in Pi for<br>Completing Social Tasks</h1>
  <p>Earn daily Pi by completing social tasks, posting adverts, watching ads and referring friends for top businesses and brands.</p>
  <div class="dots"><span class="dot active"></span><span class="dot"></span><span class="dot"></span><span class="dot"></span></div>
</div>

<div class="bottom">
  <button class="btn1" onclick="alert('Pi Login coming')">SIGN IN WITH PI</button>
  <a href="home.html" style="text-decoration:none"><button class="btn2">CONTINUE AS GUEST</button></a>
</div>

</body>
</html>
