<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Hendchi</title>
<script src="https://sdk.minepi.com/pi-sdk.js"></script>
<style>
* {margin: 0; padding: 0; box-sizing: border-box; font-family: Arial, sans-serif;}
body {background: #fff; min-height: 100vh; display: flex; flex-direction: column; padding: 20px 24px;}
.header {padding: 10px 0;}
.app-name {font-size: 20px; font-weight: 700; color: #000;}
.content {flex: 1; display: flex; flex-direction: column; justify-content: center;}
.content h1 {font-size: 32px; font-weight: 800; color: #111; margin-bottom: 16px; line-height: 1.2;}
.content p {font-size: 16px; color: #444; line-height: 1.6; margin-bottom: 24px;}
.dots {display: flex; justify-content: center; gap: 8px; margin-bottom: 10px;}
.dot {width: 8px; height: 8px; border-radius: 50%; background: #D1D5DB;}
.dot.active {background: #111; width: 24px; border-radius: 10px;}
.button-area {display: flex; flex-direction: column; gap: 12px; padding-bottom: 20px;}
.btn-main {width: 100%; padding: 16px; background: #111; color: white; font-weight: 700; border: none; border-radius: 12px; font-size: 16px;}
.btn-outline {width: 100%; padding: 16px; background: white; color: #111; font-weight: 700; border: 2px solid #E5E7EB; border-radius: 12px; font-size: 16px; text-align: center; text-decoration: none;}
</style>
</head>
<body>
  <div class="header"><h2 class="app-name">hendchi</h2></div>
  
  <div class="content">
    <h1>Get Paid in Pi for<br>Completing Social Tasks</h1>
    <p>Earn daily Pi by completing social tasks, posting adverts, watching ads and referring friends for top businesses and brands.</p>
    <div class="dots"><span class="dot active"></span><span class="dot"></span><span class="dot"></span><span class="dot"></span></div>
  </div>
  
  <div class="button-area">
    <button class="btn-main" onclick="loginWithPi()">SIGN IN WITH PI</button>
    <a href="home.html" class="btn-outline">CONTINUE AS GUEST</a>
  </div>

<script>
Pi.init({ version: "2.0", sandbox: true });
function loginWithPi() {
  const scopes = ['username', 'payments'];
  Pi.authenticate(scopes, function(payment) {console.log('incomplete payment', payment);})
  .then(function(auth) {alert("Welcome " + auth.user.username + "!"); window.location.href = "home.html";})
  .catch(function(error) {alert("Login failed: " + error);});
}
</script>
</body>
</html>
