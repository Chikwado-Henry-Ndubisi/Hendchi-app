<!DOCTYPE html>
<html>
<head><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hendchi</title>
<style>
body{margin:0;font-family:Arial;background:#f5f5f5;padding-bottom:60px}
.header{background:#6B21A8;color:#fff;padding:20px}
.header h1{font-size:24px;margin:0}
.balance{background:#fff;margin:15px;padding:20px;border-radius:12px}
.balance h2{font-size:36px;margin:10px 0}
.balance h2 span{color:#F59E0B}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:15px;padding:0 15px}
.card{background:#fff;padding:15px;border-radius:12px;box-shadow:0 2px 5px rgba(0,0,0,0.1);cursor:pointer}
.big-btn{background:#000;color:#fff;text-align:center;padding:18px;margin:20px 15px;border-radius:12px;font-weight:900;font-size:18px;cursor:pointer}
.nav{position:fixed;bottom:0;width:100%;background:#fff;display:flex;justify-content:space-around;padding:10px 0;border-top:1px solid #ddd}
</style>
</head>
<body>
<div class="header"><h1>Welcome to Hendchi 👋</h1><p id="userId">User: guest</p></div>
<div class="balance"><small>Your Pi Balance</small><h2 id="piBalance">0.000 <span>π</span></h2><p>100% FREE - No payment needed</p></div>
<div class="grid">
<div class="card" onclick="window.location.href='tasks.html'"><h3>📋 Tasks</h3><p>12 Available FREE</p></div>
<div class="card" onclick="alert('Coming Soon')"><h3>📺 Watch Ads</h3><p>Earn 0.01π</p></div>
<div class="card" onclick="alert('Coming Soon')"><h3>👥 Referrals</h3><p>0 Friends</p></div>
<div class="card" onclick="alert('Coming Soon')"><h3>💰 Wallet</h3><p>Withdraw Pi</p></div>
</div>
<div class="big-btn" onclick="claimDaily()">CLAIM DAILY TASK<br>+0.001π</div>
<div class="nav"><div><b>Home</b></div><div onclick="window.location.href='tasks.html'">Tasks</div><div>Wallet</div><div>Profile</div></div>
<script>
let balance = parseFloat(localStorage.getItem('piBalance')) || 0;
document.getElementById('piBalance').textContent = balance.toFixed(3) + ' π';
let userId = localStorage.getItem('userId') || 'guest_' + Date.now();
localStorage.setItem('userId', userId);
document.getElementById('userId').textContent = 'User: ' + userId;
function claimDaily(){
let lastClaim = localStorage.getItem('lastClaim');
let today = new Date().toDateString();
if(lastClaim === today){alert('Already claimed today');return;}
balance += 0.001;localStorage.setItem('piBalance', balance);localStorage.setItem('lastClaim', today);
document.getElementById('piBalance').textContent = balance.toFixed(3) + ' π';
alert('Success! +0.001π Added');
}
</script>
</body>
</html>
