<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hendchi - Pi Social Tasks</title>
  <script src="https://sdk.minepi.com/pi-sdk.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: Arial, sans-serif; background: #fff; color: #333; overflow-x: hidden; }
    .header { display: flex; justify-content: space-between; align-items: center; padding: 15px 20px; background: #fff; box-shadow: 0 2px 5px rgba(0,0,0,0.05); }
    .logo { display: flex; align-items: center; gap: 8px; font-weight: bold; font-size: 18px; color: #7B2CBF; }
    .logo-box { width: 20px; height: 20px; background: #FF3B30; border-radius: 4px; }
    .menu { font-size: 24px; cursor: pointer; }
    .slider { text-align: center; padding: 40px 20px 20px; }
    .slider h1 { font-size: 24px; font-weight: 900; margin-bottom: 10px; line-height: 1.3; }
    .slider p { font-size: 14px; color: #666; margin-bottom: 20px; }
    .dots { display: flex; justify-content: center; gap: 8px; margin-bottom: 30px; }
    .dot { width: 8px; height: 8px; border-radius: 50%; background: #ddd; }
    .dot.active { background: #7B2CBF; width: 20px; border-radius: 10px; }
    .btn { width: 90%; max-width: 400px; margin: 10px auto; padding: 16px; border-radius: 12px; font-weight: bold; font-size: 16px; cursor: pointer; display: block; box-shadow: 0 4px 10px rgba(123,44,191,0.3); }
    .btn-primary { background: #7B2CBF; color: white; border: none; }
    .btn-outline { background: white; color: #7B2CBF; border: 2px solid #7B2CBF; box-shadow: none; }
    .watermark { position: fixed; bottom: 50px; left: 50%; transform: translateX(-50%); opacity: 0.05; font-size: 80px; font-weight: 900; color: #7B2CBF; z-index: -1; }
    .page { display: none; padding: 20px; }
    .page.active { display: block; }
  </style>
</head>
<body>
  <div class="header">
    <div class="logo"><div class="logo-box"></div> hendchi</div>
    <div class="menu">☰</div>
  </div>

  <div id="welcome" class="page active">
    <div class="slider">
      <h1>Get People to Post Your Adverts on Their Accounts for a Fee</h1>
      <p>Get real people to grow your social media portfolio</p>
      <div class="dots"><div class="dot"></div><div class="dot"></div><div class="dot active"></div><div class="dot"></div></div>
    </div>
    <button class="btn btn-primary" onclick="login()">CREATE FREE ACCOUNT</button>
    <button class="btn btn-outline" onclick="login()">LOGIN TO YOUR ACCOUNT</button>
    <div class="watermark">hend</div>
  </div>

  <div id="home" class="page">
    <h2>Welcome to Hendchi!</h2>
    <p id="balance">Loading Pi Balance...</p>
  </div>

  <script>
    function login() {
      Pi.authenticate(["payments"], function(payment) {}).then(function(auth) {
        document.getElementById('welcome').classList.remove('active');
        document.getElementById('home').classList.add('active');
        document.getElementById('balance').innerText = "Your Pi Balance: Loading...";
      }).catch(function(error) { alert("Login failed"); });
    }
    Pi.init({ version: "2.0" });
  </script>
</body>
</html>
