<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hendchi Home</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial}
body{background:#f5f5f5;padding-bottom:10vh}

.header{background:#6B21A8;color:#fff;padding:3vh 5vw}
.header h1{font-size:3.8vh;font-weight:900}
.header p{font-size:2.2vh;opacity:0.9;margin-top:0.5vh}

.balance{background:#fff;margin:2vh 5vw;padding:3vh;border-radius:3vw;box-shadow:0 2px 8px rgba(0,0,0,0.05)}
.balance small{color:#666;font-size:2.2vh}
.balance h2{font-size:6vh;margin:1vh 0}
.balance h2 span{color:#F59E0B}
.balance p{font-size:1.8vh;color:#999}

.grid{display:grid;grid-template-columns:1fr 1fr;gap:2vh;padding:0 5vw}
.card{background:#fff;padding:2.5vh;border-radius:3vw;box-shadow:0 2px 8px rgba(0,0,0,0.05);cursor:pointer;text-align:left}
.card h3{font-size:2.5vh;margin-bottom:0.5vh}
.card p{font-size:2vh;color:#666}

.big-btn{background:#000;color:#fff;text-align:center;padding:2.5vh;margin:3vh 5vw;border-radius:3vw;font-size:2.8vh;font-weight:900;cursor:pointer}

.nav{position:fixed;bottom:0;left:0;width:100%;background:#fff;display:flex;justify-content:space-around;padding:1.5vh 0;border-top:1px solid #ddd}
.nav-item{text-align:center;font-size:2vh;color:#999}
.nav-item.active{color:#000;font-weight:900}
</style>
</head>
<body>

<div class="header">
  <h1>Welcome to Hendchi 👋</h1>
  <p id="userId">User: guest_1787705677965</p>
</div>

<div class="balance">
  <small>Your Pi Balance</small>
  <h2 id="piBalance">0.000 <span>π</span></h2>
  <p>100% FREE - No payment needed</p>
</div>

<div class="grid">
  <div class="card" onclick="window.location.href='tasks.html'">
    <h3>📋 Tasks</h3>
    <p>12 Available FREE</p>
  </div>
  <div class="card" onclick="alert('Watch Ad +0.01π')">
    <h3>📺 Watch Ads</h3>
    <p>Earn 0.01π</p>
  </div>
  <div class="card" onclick="alert('Referrals')">
    <h3>👥 Referrals</h3>
    <p>0 Friends</p>
  </div>
  <div class="card" onclick="alert('Wallet')">
    <h3>💰 Wallet</h3>
    <p>Withdraw Pi</p>
  </div>
</div>

<div class="big-btn" onclick="claimDaily()">
  CLAIM DAILY TASK<br>+0.001π
</div>

<div class="nav">
  <div class="nav-item active">Home</div>
  <div class="nav-item" onclick="window.location.href='tasks.html'">Tasks</div>
  <div class="nav-item">Wallet</div>
  <div class="nav-item">Profile</div>
</div>

<script>
let balance = parseFloat(localStorage.getItem('piBalance')) || 0;
document.getElementById('piBalance').textContent = balance.toFixed(3) + ' π';
let userId = localStorage.getItem('userId') || 'guest_' + Date.now();
localStorage.setItem('userId', userId);
document.getElementById('userId').textContent = 'User: ' + userId;

function claimDaily(){
  let lastClaim = localStorage.getItem('lastClaim');
  let today = new Date().toDateString();
  if(lastClaim === today){ alert('You already claimed today!'); return; }
  balance += 0.001;
  localStorage.setItem('piBalance', balance);
  localStorage.setItem('lastClaim', today);
  document.getElementById('piBalance').textContent = balance.toFixed(3) + ' π';
  alert('Success! +0.001π Added');
}
</script>
</body>
</html>
