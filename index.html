<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hendchi</title>
  <script src="https://sdk.minepi.com/pi-sdk.js"></script>
  <style>
    body{font-family:Arial; margin:0; background:#f5f5f5;}
    .page{display:none; padding:20px; text-align:center;}
    .active{display:block;}
    button{background:#6b21a8; color:white; border:none; padding:15px 30px; border-radius:10px; font-size:16px; margin:10px;}
    .nav{position:fixed; bottom:0; width:100%; background:white; display:flex; justify-content:space-around; padding:10px 0; box-shadow:0 -2px 5px rgba(0,0,0,0.1);}
    h1{color:#6b21a8;}
  </style>
</head>
<body>

<div id="loginPage" class="page active">
  <h1>Get Paid in Pi</h1>
  <p>Earn daily Pi by posting adverts and performing simple social tasks</p>
  <button id="loginBtn">LOGIN WITH PI</button>
</div>

<div id="homePage" class="page">
  <h1>Welcome <span id="username"></span>!</h1>
  <p>Your Pi Balance: 0.00 π</p>
  <button onclick="showPage('tasksPage')">View Tasks</button>
</div>

<div id="tasksPage" class="page">
  <h1>Available Tasks</h1>
  <div style="background:white; padding:15px; margin:10px; border-radius:10px;">
    <p><b>Post Advert on Facebook</b></p>
    <p>Earn: 0.01 π</p>
    <button>Do Task</button>
  </div>
  <button onclick="showPage('homePage')">Back to Home</button>
</div>

<div class="nav">
  <button onclick="showPage('homePage')">Home</button>
  <button onclick="showPage('tasksPage')">Tasks</button>
</div>

<script>
  Pi.init({ version: "2.0" });
  
  function showPage(pageId){
    document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
    document.getElementById(pageId).classList.add('active');
  }

  document.getElementById("loginBtn").onclick = function() {
    Pi.authenticate(['username'], function(auth) {
      document.getElementById("username").innerText = auth.user.username;
      showPage('homePage');
    }).catch(function(error) {
      alert("Login failed");
    });
  };
</script>

</body>
    </html>
