<!DOCTYPE html>
<html><head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hendchi</title>
<script src="https://sdk.minepi.com/pi-sdk.js"></script>
<style>
  body{font-family:Arial;text-align:center;background:linear-gradient(135deg,#7B2CBF,#C77DFF);color:#fff;margin:0;padding:0;overflow:hidden}
  h1{margin-top:80px;font-size:32px}
  .moving{margin:30px 0;font-size:18px;animation:slide 3s infinite}
  @keyframes slide{0%{opacity:0;transform:translateY(10px)}50%{opacity:1}100%{opacity:0;transform:translateY(-10px)}}
  .btn{padding:16px 40px;margin:10px;border:none;border-radius:12px;font-size:18px;font-weight:900;cursor:pointer;width:80%;max-width:300px}
  .btn1{background:#fff;color:#7B2CBF}
  .btn2{background:#FFD60A;color:#000}
</style>
</head><body>
  <h1>Welcome to Hendchi</h1>
  <div class="moving">Earn Pi • Withdraw Pi • Shop with Pi</div>
  
  <button class="btn btn1" onclick="create()">CREATE ACCOUNT</button>
  <button class="btn btn2" onclick="login()">LOGIN WITH PI</button>
  
<script>
  Pi.init({ version: "2.0", sandbox: true });
  async function login(){
    const auth = await Pi.authenticate(['username']);
    alert("Welcome back " + auth.user.username);
  }
  function create(){
    login(); // In Pi, create = login first time
  }
</script>
</body></html>
