<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hendchi</title>
<script src="https://sdk.minepi.com/pi-sdk.js" defer></script>
<style>
* {margin:0; padding:0; box-sizing:border-box; font-family: Arial, sans-serif;}
body {background:#fff; overflow:hidden;}
.page {display:none; width:100%; height:100vh;}
.active {display:flex; flex-direction:column;}
#splash {background:#6b21a8; justify-content:center; align-items:center;}
#splash h1 {color:#fff; font-size:36px; display:flex; align-items:center; gap:8px;}
.logo-c {width:32px; height:32px; background:#ff3b30; border-radius:50% 0 0 50%;}
#loading {background:#f5f5f5; justify-content:center; align-items:center;}
.spinner {border:5px solid #e0e0e0; border-top:5px solid #6b21a8; border-radius:50%; width:45px; height:45px; animation:spin 1s linear infinite;}
@keyframes spin {to {transform:rotate(360deg);}}
#onboard {background:#fff;}
.top {padding:20px; display:flex; justify-content:space-between; align-items:center;}
.logo {display:flex; align-items:center; gap:6px; color:#6b21a8; font-size:22px; font-weight:bold;}
.content {flex:1; padding:20px 30px; text-align:center; display:flex; flex-direction:column; justify-content:center;}
.content h2 {font-size:26px; color:#000; line-height:1.4; margin-bottom:12px; font-weight:700;}
.content p {font-size:15px; color:#555; line-height:1.5;}
.dots {display:flex; justify-content:center; gap:8px; margin-top:20px;}
.dot {width:8px; height:8px; background:#d0d0d0; border-radius:50%;}
.dot.active {width:24px; background:#6b21a8; border-radius:12px;}
.bottom {padding:0 20px 40px;}
.btn1 {width:100%; padding:16px; background:#6b21a8; color:#fff; border:none; border-radius:12px; font-size:16px; font-weight:bold; margin-bottom:12px; cursor:pointer;}
.btn2 {width:100%; padding:16px; background:#fff; color:#6b21a8; border:2px solid #6b21a8; border-radius:12px; font-size:16px; font-weight:bold; cursor:pointer;}
#home {background:#f5f5f5; padding:20px;}
#home h1 {font-size:24px;}
.card {background:linear-gradient(135deg,#6b21a8,#9333ea); color:#fff; padding:25px; border-radius:20px; text-align:center; margin-top:20px;}
.card h2 {font-size:16px; font-weight:400;}
.card h3 {font-size:40px; margin-top:8px;}
</style>
</head>
<body>

<div id="splash" class="page active"><h1><div class="logo-c"></div>Hendchi</h1></div>
<div id="loading" class="page"><div class="spinner"></div></div>

<div id="onboard" class="page">
  <div class="top">
    <div class="logo"><div class="logo-c"></div>hendchi</div>
    <div>☰</div>
  </div>
  <div class="content">
    <h2 id="title">Get People to Post Your Adverts on their Social Media</h2>
    <p id="text">Get people with atleast 1,000 followers to post your adverts</p>
    <div class="dots"><span class="dot"></span><span class="dot active"></span><span class="dot"></span><span class="dot"></span></div>
  </div>
  <div class="bottom">
    <button class="btn1" onclick="piLogin()">CREATE FREE ACCOUNT</button>
    <button class="btn2" onclick="piLogin()">LOGIN TO YOUR ACCOUNT</button>
  </div>
</div>

<div id="home" class="page">
  <h1>Welcome <span id="user">Pioneer</span> 👋</h1>
  <div class="card"><h2>Your Pi Balance</h2><h3>0.000 π</h3></div>
</div>

<script>
window.addEventListener('load', function() {
  let n=1, timer;
  const data=[
   {t:"Get Paid for Posting Adverts Daily on Your Social Media",p:"Earn daily Pi by posting adverts and performing simple social tasks"},
   {t:"Get People to Post Your Adverts on their Social Media",p:"Get people with atleast 1,000 followers to post your adverts"},
   {t:"Boost Your Social Media Engagement and Portfolio",p:"Get real people to grow your social media portfolio"},
   {t:"Sell Faster on Hendchi Marketplace",p:"Take advantage of our huge web traffic and sell your products faster"}
  ];
  function show(id){document.querySelectorAll('.page').forEach(x=>x.classList.remove('active'));document.getElementById(id).classList.add('active')}
  function slide(){n=(n+1)%4;document.getElementById('title').innerText=data[n].t;document.getElementById('text').innerText=data[n].p;document.querySelectorAll('.dot').forEach((d,i)=>d.className='dot'+(i==n?' active':''))}
  setTimeout(()=>show('loading'),2000);
  setTimeout(()=>{show('onboard');timer=setInterval(slide,3000)},3000);

  if(window.Pi){
    window.Pi.init({ version: "2.0", sandbox: true });
  }

  window.piLogin = function(){
    clearInterval(timer);
    if (!window.Pi) {
      alert("Error: Open this app inside Pi Browser only");
      timer=setInterval(slide,3000);
      return;
    }
    window.Pi.authenticate(['username'],
      function(auth) {
        document.getElementById('user').innerText = auth.user.username;
        show('home')
      },
      function(error) {
        alert("Login failed: " + JSON.stringify(error));
        timer=setInterval(slide,3000)
      }
    );
  }
});
</script>
</body>
</html>
